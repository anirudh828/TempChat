services:
  # The Backend Node.js Service
  - type: web
    name: tempchat-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: tempchat-frontend
          property: url
    disk:
      name: tempchat-db
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # The Frontend Static Site
  - type: web
    name: tempchat-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tempchat-backend
          property: url
